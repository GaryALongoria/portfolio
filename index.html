const recordArrow = document.getElementById("arrow");
const recordSlides = document.querySelectorAll("#records .record");

let currentRecord = 0;

/* One audio player for the entire record system */
const recordAudio = new Audio();
recordAudio.preload = "auto";


function stopRecordAudio() {
    recordAudio.pause();
    recordAudio.currentTime = 0;
    recordAudio.removeAttribute("src");
    recordAudio.load();
}


function showRecord(index) {

    /* Stop whatever record audio is currently playing */
    stopRecordAudio();

    /* Hide all records */
    recordSlides.forEach(record => {
        record.classList.remove("active");
    });

    /* Show selected record */
    const record = recordSlides[index];

    record.classList.add("active");

    currentRecord = index;

    /* Load audio belonging to this record */
    const audioFile = record.dataset.audio;

    if (audioFile) {

        recordAudio.src = audioFile;

        recordAudio.play().catch(error => {
            console.log("Record audio waiting for user interaction:", error);
        });
    }
}


/* Next record */
recordArrow.addEventListener("click", () => {

    const nextRecord =
        (currentRecord + 1) % recordSlides.length;

    showRecord(nextRecord);

});


/* Default record */
showRecord(0);

const outlawVideo = document.getElementById("outlawVideo");
const outlawCloseBtn = document.getElementById("outlawCloseBtn");

    if(!outlawVideo) return;

    // unload file from memory
    outlawVideo.removeAttribute("src");
    outlawVideo.load();

    // hide video container
    document.getElementById("outlawdiv").style.display = "none";
}

outlawCloseBtn.addEventListener("click", unloadOutlaw);



function unloadTV() {
    if (!tv) return;
    tv.pause();              // stop playback
    tv.removeAttribute("src"); // remove source
    tv.load();               // force browser to unload it
    tv.style.display = "none"; // optional: hide it visually
}

    if (!carousel.classList.contains("active")) return; // 👈 prevent unnecessary clearing

let currentSet = [];
let index = 0;
const carousel = document.getElementById("carousel");
const mediaLayer = document.getElementById("mediaLayer");

document.querySelectorAll("[data-set]").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();

    const key = btn.dataset.set;
    if (!sets[key]) return;

    currentSet = sets[key];
    index = 0;

    openCarousel();
  });
});

function openCarousel(){
  carousel.classList.add("active");
  showItem();
}

function closeCarousel(){
  carousel.classList.remove("active");
  mediaLayer.innerHTML = "";
  hideOverlays();
}

function showItem(){
  mediaLayer.innerHTML = "";
  document.querySelectorAll(".overlay").forEach(o=>{
    o.classList.remove("active");
    o.style.display = "none";
});

  const item = currentSet[index];

if(item.media){

    const img = document.createElement("img");

    img.src = item.media;
    img.className = "carousel-media";

    img.style.position = "relative";
    img.style.zIndex = "2";

    mediaLayer.appendChild(img);
}

  // overlay image (art overlay)
  if(item.overlayImg){
    const overlayImg = document.createElement("img");
    overlayImg.src = item.overlayImg;
    overlayImg.className = "carousel-media";
    overlayImg.style.position = "absolute";
    overlayImg.style.left = "50%";
    overlayImg.style.top = "50%";
    overlayImg.style.transform = "translate(-50%, -50%)";
    

    overlayImg.style.maxWidth = "80vw";
    overlayImg.style.maxHeight = "80vh";

    overlayImg.style.objectFit = "contain";
    overlayImg.style.zIndex = "5";
    mediaLayer.appendChild(overlayImg);
  }

  // UI overlay (links/buttons)
  if(item.overlay){
    const el = document.getElementById(item.overlay);
    if(el){
   el.style.display = "flex";
   el.classList.add("active");
}
  }
}

function hideOverlays(){
  document.querySelectorAll(".overlay").forEach(o=>{
    o.classList.remove("active");
    o.style.display = "none";
  });
}

carousel.addEventListener("click", (e)=>{
  if(e.target === carousel){
    closeCarousel();
  }
});

document.addEventListener("keydown", (e)=>{
  if(!carousel.classList.contains("active")) return;

  if(e.key === "ArrowRight"){
    index = (index + 1) % currentSet.length;
    showItem();
  }

  if(e.key === "ArrowLeft"){
    index = (index - 1 + currentSet.length) % currentSet.length;
    showItem();
  }

  if(e.key === "Escape"){
    closeCarousel();
  }
});
